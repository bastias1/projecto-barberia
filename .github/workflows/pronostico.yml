name: Pronóstico de demanda (HU-25)

on:
  schedule:
    - cron: "0 7 * * 1"   # lunes 07:00 UTC
  workflow_dispatch:       # también se puede lanzar a mano desde la pestaña Actions

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: python -m pytest ml -q
      - run: python ml/pronostico.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
